<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Nexus Catálogo Premium</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-2: #eef1f6;
    --text: #172033;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #111827;
    --accent-2: #374151;
    --shadow: 0 12px 35px rgba(15, 23, 42, .10);
}

body.dark {
    --bg: #0b1020;
    --surface: #151b2d;
    --surface-2: #20283b;
    --text: #f8fafc;
    --muted: #aab3c5;
    --border: #30394d;
    --accent: #f8fafc;
    --accent-2: #dbe2ef;
    --shadow: 0 12px 35px rgba(0, 0, 0, .30);
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .25s, color .25s;
}

button {
    font: inherit;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,.06);
}

.topo {
    width: min(1200px, 94%);
    margin: auto;
    padding: 16px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.marca {
    min-width: 0;
}

.marca h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: -.5px;
}

.marca p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
}

.acoes {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.acao {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 10px;
    min-width: 42px;
    height: 42px;
    padding: 0 12px;
    cursor: pointer;
    transition: transform .15s, background .2s;
}

.acao:hover {
    transform: translateY(-1px);
}

.acao:active {
    transform: scale(.96);
}

main {
    width: min(1200px, 94%);
    margin: 28px auto 90px;
}

.hero {
    padding: 30px 0 25px;
}

.hero h2 {
    margin: 0;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: -1.5px;
}

.hero p {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 16px;
}

#status {
    text-align: center;
    margin: 15px 0 25px;
    color: var(--muted);
}

#catalogo {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 22px;
}

#catalogo.lista {
    grid-template-columns: 1fr;
}

.anuncio {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .2s, box-shadow .2s;
}

.anuncio:hover {
    transform: translateY(-3px);
}

.lista .anuncio {
    display: grid;
    grid-template-columns: 300px 1fr;
}

.midia {
    position: relative;
    background: var(--surface-2);
    min-height: 220px;
    margin-bottom: 14px;
    border-radius: 14px;
    overflow: hidden;
}

.midia-imagem img {
    cursor: zoom-in;
}

.midia img,
.midia video {
    width: 100%;
    height: 100%;
    min-height: 220px;
    max-height: 320px;
    object-fit: cover;
    display: block;
}

.conteudo {
    padding: 20px;
}

.conteudo h2 {
    margin: 0 0 8px;
    font-size: 21px;
}

.preco {
    font-size: 25px;
    font-weight: 800;
    margin: 12px 0 16px;
}

.campo {
    margin: 7px 0;
    color: var(--muted);
    line-height: 1.4;
}

.campo strong {
    color: var(--text);
}

.descricao {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid var(--border);
    line-height: 1.5;
    max-height: 300px;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 10px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
}

#voltarTopo {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 200;
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg);
    cursor: pointer;
    box-shadow: var(--shadow);
    display: none;
}

.vazio {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
}

footer {
    text-align: center;
    color: var(--muted);
    padding: 30px 15px;
    font-size: 13px;
}

@media (max-width: 850px) {
    #catalogo {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .lista .anuncio {
        grid-template-columns: 220px 1fr;
    }
}

@media (max-width: 600px) {
    .topo {
        align-items: flex-start;
    }

    .marca h1 {
        font-size: 19px;
    }

    .marca p {
        font-size: 11px;
    }

    .acao {
        width: 40px;
        min-width: 40px;
        padding: 0;
    }

    main {
        width: 92%;
        margin-top: 15px;
    }

    .hero {
        padding: 20px 0;
    }

    #catalogo,
    #catalogo.lista {
        grid-template-columns: 1fr;
    }

    .lista .anuncio {
        display: block;
    }
}

.btn-anuncio-acoes {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 18px;
}

.btn-anuncio-acoes button {
    flex: 1;
    min-width: 140px;
    padding: 12px 16px;
    border: 0;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.2s ease;
}

.btn-anuncio-acoes button:hover {
    transform: translateY(-2px);
    opacity: 0.9;
}

.btn-wa {
    background: #25D366;
    color: #fff;
}

.btn-ai {
    background: #111827;
    color: #fff;
}

body.dark .btn-ai {
    background: #fff;
    color: #111827;
}

</style>
</head>

<body>

<header>
    <div class="topo">
        <div class="marca">
            <h1>🛍️ NEXUS CATÁLOGO</h1>
            <p>Uma vitrine para encontrar o que você procura</p>
        </div>

        <div class="acoes">
            <button class="acao" style="background:#19e68c; color:#06130d; font-weight:800;" onclick="window.open('https://nexus-catalogo.onrender.com/', '_blank')" title="Criar anúncio">
                ➕ CRIAR ANÚNCIO
            </button>
            <button class="acao" id="btnVoltar" title="Voltar">←</button>
            <button class="acao" id="btnFechar" title="Fechar">✕</button>
            <button class="acao" id="btnTema" title="Modo claro/escuro">🌙</button>
            <button class="acao" id="btnGrade" title="Modo grade">▦</button>
            <button class="acao" id="btnLista" title="Modo lista">☰</button>
        </div>
    </div>
</header>

<main>
    <section class="hero">
        <h2>Produtos e anúncios</h2>
        <p>Explore nossa vitrine e encontre seu próximo produto.</p>
    </section>

    <div id="status">Carregando anúncios...</div>

    <section id="catalogo"></section>
</main>

<button id="voltarTopo" title="Voltar ao topo">↑</button>

<footer>
    Nexus Catálogo Premium
</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAS2NIZzWujvEFCvznq7RRrpai3lfAr1YU",
    authDomain: "ia-termux.firebaseapp.com",
    databaseURL: "https://ia-termux-default-rtdb.firebaseio.com",
    projectId: "ia-termux",
    storageBucket: "ia-termux.firebasestorage.app",
    messagingSenderId: "563930488672",
    appId: "1:563930488672:web:dc73144be15c2a3a850805"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const catalogo = document.getElementById("catalogo");
const status = document.getElementById("status");

function formatarPreco(valor) {
    if (valor === undefined || valor === null || valor === "") {
        return "";
    }

    const numero = Number(
        String(valor)
            .replace("R$", "")
            .replace(/\./g, "")
            .replace(",", ".")
            .trim()
    );

    if (!Number.isNaN(numero)) {
        return numero.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        });
    }

    return String(valor);
}

function obterFoto(anuncio) {
    if (typeof anuncio.fotos === "string" && anuncio.fotos.trim()) {
        return anuncio.fotos.trim();
    }

    if (Array.isArray(anuncio.fotos) && anuncio.fotos.length) {
        return anuncio.fotos[0];
    }

    if (anuncio.fotos && typeof anuncio.fotos === "object") {
        const valores = Object.values(anuncio.fotos);
        if (valores.length) return valores[0];
    }

    return anuncio.imagem || anuncio.image || "";
}

function criarMidia(anuncio) {
    const foto = obterFoto(anuncio);
    const video = anuncio.video || anuncio.video_url || "";

    return `
        ${foto ? `
            <div class="midia midia-imagem">
                <img src="${foto}" alt="${anuncio.nome || "Produto"}" loading="lazy"
                     onclick="ampliarImagem(this.src, this.alt)">
            </div>
        ` : ""}

        ${video ? `
            <div class="midia">
                <video controls playsinline preload="metadata">
                    <source src="${video}" type="video/mp4">
                    Seu navegador não suporta vídeo.
                </video>
            </div>
        ` : ""}

        ${!foto && !video ? `
            <div class="midia">
                <div style="height:220px;display:flex;align-items:center;justify-content:center;color:var(--muted);">
                    Sem imagem ou vídeo
                </div>
            </div>
        ` : ""}
    `;
}

function criarAnuncio(anuncio) {
    return `
        <article class="anuncio">
            ${criarMidia(anuncio)}

            <div class="conteudo">
                <h2>${anuncio.nome || "Produto"}</h2>

                <div class="preco">
                    ${formatarPreco(anuncio.preco)}
                </div>

                ${anuncio.condicao ? `<div class="campo"><strong>Condição:</strong> ${anuncio.condicao}</div>` : ""}
                ${anuncio.vendedor ? `<div class="campo"><strong>Vendedor:</strong> ${anuncio.vendedor}</div>` : ""}
                ${anuncio.contato ? `<div class="campo"><strong>Contato:</strong> ${anuncio.contato}</div>` : ""}
                ${anuncio.endereco ? `<div class="campo"><strong>Retirada:</strong> ${anuncio.endereco}</div>` : ""}
                ${anuncio.taxa ? `<div class="campo"><strong>Entrega:</strong> ${anuncio.taxa}</div>` : ""}
                ${anuncio.pagamento ? `<div class="campo"><strong>Pagamento:</strong> ${anuncio.pagamento}</div>` : ""}

                ${anuncio.descricao ? `<div class="descricao">${anuncio.descricao}</div>` : ""}

                <div class="btn-anuncio-acoes">
                    <button class="btn-share" onclick='compartilharAnuncioPorId(encodeURIComponent(${JSON.stringify(anuncio.id || "")}))'>
                        📤 Compartilhar
                    </button>
                    <button class="btn-wa" onclick='abrirWhatsAppPorId(encodeURIComponent(${JSON.stringify(anuncio.id || "")}))'>
                        💚 WhatsApp
                    </button>
                    <button class="btn-ai" onclick='abrirMetaAIPorId(encodeURIComponent(${JSON.stringify(anuncio.id || "")}))'>
                        🤖 Meta AI
                    </button>
                </div>
            </div>
        </article>
    `;
}




function obterAnuncioPorId(id) {
    const idDecodificado = decodeURIComponent(id || "");

    return anunciosCatalogo.find(
        anuncio => String(anuncio.id || "") === String(idDecodificado)
    );
}

function compartilharAnuncioPorId(id) {
    const anuncio = obterAnuncioPorId(id);
    if (anuncio) compartilharAnuncio(anuncio);
}

function abrirWhatsAppPorId(id) {
    const anuncio = obterAnuncioPorId(id);
    if (anuncio) abrirWhatsApp(anuncio);
}

function abrirMetaAIPorId(id) {
    const anuncio = obterAnuncioPorId(id);
    if (anuncio) abrirMetaAI(anuncio);
}

async function compartilharAnuncio(anuncio) {
    const produto = anuncio.nome || "Produto";
    const preco = formatarPreco(anuncio.preco);
    const codigo = anuncio.codigo || anuncio.id || "";
    const link = `${window.location.origin}/?id=${encodeURIComponent(anuncio.id || "")}`;

    const dados = {
        title: produto,
        text: `Confira este anúncio: ${produto} - ${preco} - Código: ${codigo}`,
        url: link
    };

    try {
        if (navigator.share) {
            await navigator.share(dados);
        } else {
            await navigator.clipboard.writeText(link);
            alert("Link do anúncio copiado!");
        }
    } catch (erro) {
        if (erro.name === "AbortError") {
            return;
        }

        try {
            await navigator.clipboard.writeText(link);
            alert("Link do anúncio copiado!");
        } catch (erroCopia) {
            window.prompt("Copie o link do anúncio:", link);
        }
    }
}

function normalizarWhatsApp(contato) {
    if (!contato) return "";

    let numero = String(contato).replace(/\D/g, "");

    if (numero.startsWith("55")) {
        return numero;
    }

    if (numero.length >= 10) {
        return "55" + numero;
    }

    return numero;
}

function abrirWhatsApp(anuncio) {
    const numero = normalizarWhatsApp(anuncio.contato);

    if (!numero) {
        alert("Este anúncio não possui um contato de WhatsApp.");
        return;
    }

    const produto = anuncio.nome || "produto";
    const preco = formatarPreco(anuncio.preco);
    const codigo = anuncio.codigo || anuncio.id || "";

    const mensagem =
        `Olá, tenho interesse no produto ${produto}, ` +
        `código ${codigo}, no valor de ${preco}.`;

    const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;

    window.open(url, "_blank");
}

async function abrirMetaAI(anuncio) {
    const produto = anuncio.nome || "Produto";
    const preco = formatarPreco(anuncio.preco);
    const codigo = anuncio.codigo || anuncio.id || "";
    const descricao = anuncio.descricao || "Não informada";
    const condicao = anuncio.condicao || "Não informada";
    const endereco = anuncio.endereco || "Não informado";
    const taxa = anuncio.taxa || "Não informada";
    const pagamento = anuncio.pagamento || "Não informado";
    const vendedor = anuncio.vendedor || "Não informado";
    const contato = anuncio.contato || "Não informado";

    const link = `${window.location.origin}/?id=${encodeURIComponent(anuncio.id || "")}`;

    const prompt = `PROMPT PADRÃO — ATENDENTE VIRTUAL DE VENDAS

Atue como atendente virtual deste anúncio. Use exclusivamente as informações fornecidas abaixo para auxiliar o cliente durante o processo de compra.

Produto: ${produto}
Código: ${codigo}
Preço: ${preco}
Descrição: ${descricao}
Condição: ${condicao}
Vendedor: ${vendedor}
Contato: ${contato}
Endereço para retirada: ${endereco}
Taxa de entrega: ${taxa}
Forma de pagamento: ${pagamento}

Link personalizado do anúncio:
${link}

Apresente as principais características e vantagens do produto com clareza. Responda às dúvidas do cliente usando as informações disponíveis, sem inventar características, preços ou condições.

Informe preço, condição, entrega, retirada e pagamento quando essas informações estiverem disponíveis.

Quando o cliente demonstrar interesse, sugira uma mensagem adequada para entrar em contato com o vendedor e finalizar a compra.

Conduza a conversa de maneira natural, cordial e objetiva, ajudando o cliente durante o processo de compra.`;

    try {
        await navigator.clipboard.writeText(prompt);
        alert("Prompt copiado! Agora você pode colar no Meta AI.");
    } catch (erro) {
        console.error("Não foi possível copiar o prompt:", erro);
    }

    window.open("https://wa.me/ais/867051314767696?s=5", "_blank");
}

let anunciosCatalogo = [];

const anunciosRef = ref(database, "nexus_catalogo/anuncios");

onValue(anunciosRef, (snapshot) => {
    const dados = snapshot.val() || {};
    const anuncios = Object.values(dados);
    anunciosCatalogo = anuncios;

    catalogo.innerHTML = "";

    if (!anuncios.length) {
        status.textContent = "Nenhum anúncio disponível no momento.";
        catalogo.innerHTML = `<div class="vazio">A vitrine está vazia.</div>`;
        return;
    }

    const idSelecionado = new URLSearchParams(window.location.search).get("id");

    if (idSelecionado) {
        const anuncioSelecionado = anuncios.find(
            anuncio => String(anuncio.id || "") === String(idSelecionado)
        );

        if (!anuncioSelecionado) {
            status.textContent = "Anúncio não encontrado.";
            catalogo.innerHTML = `<div class="vazio">Este anúncio não está mais disponível.</div>`;
            return;
        }

        status.textContent = "Anúncio selecionado";
        catalogo.innerHTML = criarAnuncio(anuncioSelecionado);
        return;
    }

    status.textContent =
        `${anuncios.length} anúncio${anuncios.length === 1 ? "" : "s"} disponível${anuncios.length === 1 ? "" : "is"}`.replace("disponívelis", "disponíveis");

    catalogo.innerHTML = anuncios.map(criarAnuncio).join("");
}, (erro) => {
    console.error(erro);
    status.textContent = "Não foi possível carregar os anúncios.";
});

function aplicarTema() {
    const tema = localStorage.getItem("nexus-tema");

    if (tema === "dark") {
        document.body.classList.add("dark");
        document.getElementById("btnTema").textContent = "☀️";
    } else {
        document.body.classList.remove("dark");
        document.getElementById("btnTema").textContent = "🌙";
    }
}

document.getElementById("btnTema").addEventListener("click", () => {
    const escuro = !document.body.classList.contains("dark");

    document.body.classList.toggle("dark", escuro);
    localStorage.setItem("nexus-tema", escuro ? "dark" : "light");

    document.getElementById("btnTema").textContent = escuro ? "☀️" : "🌙";
});

document.getElementById("btnGrade").addEventListener("click", () => {
    catalogo.classList.remove("lista");
    localStorage.setItem("nexus-layout", "grade");
});

document.getElementById("btnLista").addEventListener("click", () => {
    catalogo.classList.add("lista");
    localStorage.setItem("nexus-layout", "lista");
});

document.getElementById("btnVoltar").addEventListener("click", () => {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});

document.getElementById("btnFechar").addEventListener("click", () => {
    window.close();

    setTimeout(() => {
        window.location.href = "about:blank";
    }, 150);
});

window.addEventListener("popstate", () => {
    history.pushState(null, "", location.href);
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});

history.pushState(null, "", location.href);

const layoutSalvo = localStorage.getItem("nexus-layout");

if (layoutSalvo === "lista") {
    catalogo.classList.add("lista");
}

aplicarTema();

window.addEventListener("scroll", () => {
    const botao = document.getElementById("voltarTopo");

    botao.style.display =
        window.scrollY > 350 ? "block" : "none";
});

document.getElementById("voltarTopo").addEventListener("click", () => {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});


window.compartilharAnuncioPorId = compartilharAnuncioPorId;
window.abrirWhatsAppPorId = abrirWhatsAppPorId;
window.abrirMetaAIPorId = abrirMetaAIPorId;

</script>


<style>
.visualizador-imagem {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.88);
}

.visualizador-imagem.ativo {
    display: flex;
}

.visualizador-imagem img {
    max-width: 95vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 12px;
}

.fechar-imagem {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 10000;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    font-size: 24px;
    cursor: pointer;
}
</style>

<div id="visualizadorImagem" class="visualizador-imagem" onclick="fecharImagem()">
    <button class="fechar-imagem" onclick="event.stopPropagation(); fecharImagem()">✕</button>
    <img id="imagemAmpliada" src="" alt="" onclick="event.stopPropagation()">
</div>

<script>
function ampliarImagem(src, alt) {
    const visualizador = document.getElementById("visualizadorImagem");
    const imagem = document.getElementById("imagemAmpliada");

    imagem.src = src;
    imagem.alt = alt || "Imagem ampliada";
    visualizador.classList.add("ativo");
    document.body.style.overflow = "hidden";
}

function fecharImagem() {
    const visualizador = document.getElementById("visualizadorImagem");

    visualizador.classList.remove("ativo");
    document.body.style.overflow = "";
}
</script>

</body>
</html>
